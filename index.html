<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#1e1e1e;--panel:#262626;--panel2:#2f2f2f;--line:#3a3a3a;--text:#dcddde;--dim:#9a9a9a;--faint:#666;--accent:#a882ff;--gold:#e8a33d;--teal:#4fc1a6;--red:#e06c75;--blue:#6a9ff5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Inter",sans-serif}
a{color:var(--accent);text-decoration:none}
body{overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:rgba(30,30,30,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--faint);font-size:11px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px;margin-left:auto}
.seg a{padding:6px 12px;border-radius:7px;color:var(--dim);font-size:14px;white-space:nowrap}
.seg a.on{background:#3b2f5c;color:#fff}
.ib{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 11px;font-size:15px;cursor:pointer}
#menu{display:none;position:fixed;top:calc(56px + env(safe-area-inset-top));right:10px;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;width:min(300px,calc(100% - 20px));box-shadow:0 10px 30px #0008}
#menu a{display:block;padding:9px 8px;border-radius:8px;color:var(--text)}#menu a:hover{background:#ffffff12}
#menu small{display:block;color:var(--dim);font-size:12px}
main{position:fixed;top:calc(54px + env(safe-area-inset-top));left:0;right:0;bottom:0;display:flex}
#today{flex:0 0 auto;width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px calc(40px + env(safe-area-inset-bottom))}
#webwrap{position:relative;flex:1;display:none;border-left:1px solid var(--line)}
#graph{position:absolute;inset:0}
body.web #today{display:none}body.web #webwrap{display:block}
@media (min-width:1100px){#today{width:520px;border-right:1px solid var(--line)}#webwrap{display:block!important}body.web #today{display:block}.seg{display:none}}
.hello{font-size:22px;font-weight:700;margin:2px 2px 2px}
.sub{color:var(--dim);font-size:13px;margin:0 2px 12px}
.glance{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:14px}
.g{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;color:var(--text)}
.g b{display:block;font-size:24px;line-height:1.1}
.g span{font-size:12px;color:var(--dim)}
.g.hot{border-color:#6a4f20;background:#2b2416}.g.hot b{color:#f0c27a}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);margin:2px 0 10px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h2 .n{margin-left:auto;background:var(--panel2);color:var(--text);border-radius:999px;padding:1px 9px;font-size:12px;letter-spacing:0}
.item{padding:10px 0;border-top:1px solid #333}
.item:first-of-type{border-top:0}
.who{font-weight:650;font-size:16px}
.meta{color:var(--dim);font-size:13px}
.snip{color:#bdbdbd;font-size:14px;margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--dim);margin:3px 5px 0 0;white-space:nowrap}
.pill.gold{background:#3a2c12;color:#f0c27a}.pill.red{background:#3d1f22;color:#f19aa1}.pill.teal{background:#173a33;color:#86e0c8}.pill.purple{background:#2e2545;color:#c8b3ff}
.vip{border-left:3px solid var(--gold);padding-left:10px;margin-left:-4px}
.acts{display:flex;gap:8px;margin-top:7px;flex-wrap:wrap}
.btn{display:inline-block;background:#3b2f5c;color:#fff;border-radius:8px;padding:6px 11px;font-size:13.5px;font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
.need li{margin:0 0 10px}.need{padding-left:20px;margin:0}
.need li::marker{color:var(--gold);font-weight:700}
.muted{color:var(--faint);font-size:13px}
details summary{cursor:pointer;color:var(--dim);font-size:13.5px;padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:before{content:"▸ ";color:var(--faint)}details[open] summary:before{content:"▾ "}
.areas{display:grid;gap:10px}
.area h3{font-size:14px;margin:4px 0 6px;display:flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.trow{display:flex;align-items:center;gap:8px;padding:7px 4px;border-top:1px solid #333;cursor:pointer;border-radius:6px}
.trow:hover{background:#ffffff08}
.trow .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .ago{color:var(--faint);font-size:12px;white-space:nowrap}
.ev{display:flex;gap:10px;padding:6px 0;border-top:1px solid #333}.ev:first-of-type{border-top:0}
.ev .t{width:72px;flex:0 0 72px;color:var(--gold);font-size:13px;font-weight:600;padding-top:1px}
.warn{background:#3d1f22;border:1px solid #6b2b31;color:#f5c0c4;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:14px}
/* web */
.wtop{position:absolute;top:10px;left:10px;right:10px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.wtop>*{pointer-events:auto}
#q{flex:1;min-width:140px;background:rgba(38,38,38,.92);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 11px;font-size:16px}
.wfil{position:absolute;top:56px;left:10px;z-index:5;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
@media (max-width:700px){.wfil{flex-direction:row;flex-wrap:wrap;right:10px}}
.wtop{max-width:420px}
.chipf{background:rgba(38,38,38,.92);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chipf.on{color:#fff;border-color:#777}
.legend{position:absolute;left:10px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;background:rgba(38,38,38,.92);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--dim);line-height:1.7}
#note{position:fixed;z-index:40;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;top:0;right:0;bottom:0;width:min(440px,100%);transform:translateX(105%);transition:transform .22s ease}
#note.on{transform:none}
@media (max-width:700px){#note{top:auto;left:0;width:100%;height:80dvh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(105%)}.grab{display:block!important}}
.grab{display:none;width:40px;height:4px;border-radius:2px;background:#555;margin:8px auto 0}
.nh{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 6px}
.nh h2{margin:0;font-size:20px;line-height:1.25;flex:1}
.x{background:none;border:0;color:var(--dim);font-size:26px;line-height:1;cursor:pointer}
.nb{overflow-y:auto;padding:0 16px calc(24px + env(safe-area-inset-bottom));flex:1}
.nb h3{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 6px}
.msg{background:var(--panel2);border-radius:10px;padding:8px 11px;margin-bottom:7px;font-size:14px;white-space:pre-wrap}
.msg.me{background:#3b2f5c}
.msg .w{font-size:11.5px;color:var(--dim);margin-bottom:2px}
.wl{color:var(--accent);background:none;border:0;padding:2px 0;font:inherit;cursor:pointer}
.wl:after{content:" ·";color:var(--faint)}.wl:last-child:after{content:""}
#hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--faint)}
</style></head><body>

<div id="lock" style="position:fixed;inset:0;z-index:100;background:#1e1e1e;display:flex;align-items:center;justify-content:center;padding:24px">
 <form id="lf" style="width:100%;max-width:340px;text-align:center">
  <div style="font-size:22px;font-weight:700;margin-bottom:6px">Command Center</div>
  <div style="color:#9a9a9a;font-size:14px;margin-bottom:18px">Your dashboard password</div>
  <input id="lp" type="password" autocomplete="current-password" style="width:100%;font-size:17px;padding:12px;border-radius:10px;border:1px solid #3a3a3a;background:#262626;color:#dcddde">
  <label style="display:block;color:#9a9a9a;font-size:13px;margin:10px 0"><input type="checkbox" id="lr" checked> Remember on this device</label>
  <button style="width:100%;padding:12px;border:0;border-radius:10px;background:#a882ff;color:#1a1033;font-weight:700;font-size:16px">Open</button>
  <div id="le" style="color:#f19aa1;font-size:14px;margin-top:12px;min-height:20px"></div>
 </form>
</div>
<script>
let CC_SECRET="";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptWith(pw,E){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.salt),iterations:E.iter,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.iv)},k,b64(E.ct));return JSON.parse(new TextDecoder().decode(pt))}
function loadLocked(){return fetch('data.enc.json?'+Date.now()).then(r=>r.json()).then(E=>new Promise((res)=>{
 const L=document.getElementById('lock'),f=document.getElementById('lf'),p=document.getElementById('lp'),er=document.getElementById('le');
 const tryPw=async(pw,saved)=>{try{const d=await decryptWith(pw,E);CC_SECRET=pw;if(document.getElementById('lr').checked||saved)localStorage.setItem('cc_pw',pw);L.remove();res(d)}
   catch(e){if(saved){localStorage.removeItem('cc_pw')}else{er.textContent='That password didn’t work.';p.select()}}};
 const sv=localStorage.getItem('cc_pw');if(sv)tryPw(sv,true);
 f.onsubmit=e=>{e.preventDefault();er.textContent='Opening…';tryPw(p.value,false)};}))}
</script>
<div class="top">
  <div class="brand">Command Center<small id="fresh">Loading…</small></div>
  <div class="seg"><a href="#today" id="s-today" class="on">Today</a><a href="#web" id="s-web">Topic web</a></div>
  <button class="ib" id="mb" style="display:none">☰</button>
</div>
<div id="menu"></div>
<main>
  <section id="today"></section>
  <section id="webwrap">
    <div id="graph"></div><div id="hint">Drawing your topics…</div>
    <div class="wtop"><input id="q" type="search" placeholder="Search topics, people, places…" autocomplete="off"></div>
    <div class="wfil"><span id="af"></span></div>
    <div class="legend" id="legend"></div>
  </section>
</main>
<div id="note"><div class="grab"></div><div class="nh"><h2 id="nt"></h2><button class="x" id="nx">×</button></div><div class="nb" id="nbody"></div></div>
<script>
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null,FG=null,byId={},nbrs={},hover=null,openId=null,query='',areaOn={client:1,assistant:1,ace:1};
const KCOL={place:'#4fc1a6',person:'#b0b0b0',theme:'#6a9ff5'};
function ago(h){if(h==null)return'';if(h<1)return'just now';if(h<24)return Math.round(h)+'h ago';const d=Math.round(h/24);return d+(d===1?' day':' days')+' ago'}
function waited(h){if(h==null)return'';if(h<24)return'waiting '+Math.max(1,Math.round(h))+'h';const d=Math.round(h/24);return'waiting '+d+(d===1?' day':' days')}
function fmtTime(s,allday){if(allday)return'All day';const d=new Date(s);return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
function dayLabel(s){const d=new Date(s.length===10?s+'T12:00':s);const t=new Date();const tm=new Date(Date.now()+864e5);
  if(d.toDateString()===t.toDateString())return'Today';if(d.toDateString()===tm.toDateString())return'Tomorrow';return d.toLocaleDateString([], {weekday:'long'})}
const fub=id=>'https://app.followupboss.com/2/people/view/'+id;
function compassify(text){const c=(D.briefing&&D.briefing.compass)||{};let t=esc(text);
  Object.entries(c).forEach(([addr,u])=>{const short=addr.split(' ').slice(0,2).join(' ');const re=new RegExp('('+short.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[^,·|<]*)','i');
    if(re.test(t)&&!t.includes('href'))t=t.replace(re,'<a href="'+u+'" target="_blank">$1</a>')});return t}


let privateFollowups=null;
async function sealFollowups(value){
 const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(CC_SECRET),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['encrypt']);
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(value))));
 const enc=x=>btoa(String.fromCharCode(...x));return {v:1,iter:600000,salt:enc(salt),iv:enc(iv),ct:enc(ct)};
}
async function renderPrivateFollowups(){
 const box=document.getElementById('private-followups');
 if(!privateFollowups){
  const saved=localStorage.getItem('cc_followups_encrypted');
  try{privateFollowups=saved?await decryptWith(CC_SECRET,JSON.parse(saved)):structuredClone(D.saved_followups||{items:[]});if(!Array.isArray(privateFollowups?.items))throw new Error('bad followups shape')}
  catch(e){box.textContent='Saved edits could not be unlocked. They have not been overwritten.';return}
 }
 const items=privateFollowups.items;
 box.innerHTML='<p>'+items.filter(x=>x.status!=='done').length+' open · '+items.filter(x=>x.status==='done').length+' done</p>'+items.map((x,i)=>'<div class="item"><label><input type="checkbox" data-check="'+i+'" '+(x.status==='done'?'checked':'')+'> '+esc(x.name)+'</label><div>'+esc(x.what)+'</div><div class="meta">'+esc(x.context||'')+'</div><div>'+esc(x.phone||'')+'</div><label>Notes <textarea data-note="'+i+'" style="width:100%">'+esc(x.notes||'')+'</textarea></label></div>').join('')+'<button id="fu-add" type="button">Add someone</button><button id="fu-save" type="button">Save edits on this device</button>';
 box.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{items[+e.dataset.check].status=e.checked?'done':'open'});
 box.querySelectorAll('[data-note]').forEach(e=>e.oninput=()=>{items[+e.dataset.note].notes=e.value});
 document.getElementById('fu-add').onclick=()=>{const name=prompt('Name');if(!name)return;const what=prompt('Follow-up');if(!what)return;items.push({id:crypto.randomUUID(),name,what,status:'open',notes:''});renderPrivateFollowups()};
 document.getElementById('fu-save').onclick=async()=>{const state=document.getElementById('fu-state');try{state.textContent=' Saving…';privateFollowups.updatedAt=Date.now();localStorage.setItem('cc_followups_encrypted',JSON.stringify(await sealFollowups(privateFollowups)));state.textContent=' Saved encrypted on this device';}catch(e){state.textContent=' Could not save. Keep this page open and download a backup.'}};
 document.getElementById('fu-export').onclick=async()=>{const blob=new Blob([JSON.stringify(await sealFollowups(privateFollowups))],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='followups-encrypted.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
}

function render(){
  const T=document.getElementById('today');
  const em=D.emails||[];const top=em.filter(e=>e.tier===1&&!e.old),lead=em.filter(e=>e.tier===2),rest=em.filter(e=>e.tier>2||(e.tier===1&&e.old));
  const B=D.briefing||{sections:[]};const sec=t=>B.sections.find(s=>s.title.toUpperCase().startsWith(t))||{items:[],text:[]};
  const needs=sec('NEEDS YOU'),also=sec('ALSO'),deals=sec('ACTIVE DEALS'),fyi=sec('FYI'),done=sec('DONE'),today=sec('TODAY');
  const myTopics=(D.topics||[]).filter(t=>t.turn==='you');
  const leads=D.new_leads||[];const radar=(D.radar&&D.radar.people)||[];
  const cal=(D.calendar||[]).filter(e=>!e.allday||!/birthday/i.test(e.title)||true);
  const hr=new Date().getHours();const hi=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  let h='';
  (D.errors||[]).forEach(e=>h+='<div class="warn">'+esc(e)+'</div>');
  h+='<div class="hello">'+hi+', Julianna</div><div class="sub">'+new Date().toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'})+' · here’s exactly what needs you</div>';
  h+='<div class="glance">'+
    g('people','People waiting',top.length,top.length)+g('leads','New leads',leads.length,leads.length)+
    g('needs','From this morning',needs.items.length,needs.items.length)+g('cal','Coming up',cal.filter(e=>!e.allday).length,0)+
    g('followups','My follow-ups','↗',0)+g('topics','Topics on you',myTopics.length,myTopics.length)+'</div>';
  // Embed the existing editor: one list, one save endpoint, no copied records.
  h+='<div class="card" id="c-followups"><h2>My follow-ups</h2><p class="meta">Saved list from October 29. Status has not been rechecked. Edits stay encrypted on this device; they do not sync to Ace or other devices.</p><div id="private-followups"></div><button id="fu-export" type="button">Download encrypted backup</button><span id="fu-state" role="status"></span></div>';
  // People waiting
  h+='<div class="card" id="c-people"><h2>✉️ People waiting on you<span class="n">'+top.length+'</span></h2>';
  if(!top.length)h+='<div class="muted">Nobody important is waiting on an email reply. 🎉</div>';
  top.forEach(e=>h+=emailItem(e,true));
  if(lead.length){h+='<h2 style="margin-top:14px">🌱 Leads, taxes & lenders<span class="n">'+lead.length+'</span></h2>';lead.forEach(e=>h+=emailItem(e,false))}
  if(rest.length)h+='<details><summary>Everything else in your inboxes ('+rest.length+')</summary>'+rest.map(e=>emailItem(e,false)).join('')+'</details>';
  h+='<div class="muted" style="margin-top:6px">Checked all three inboxes. Only threads where someone else wrote last.</div></div>';
  // Needs you from briefing
  h+='<div class="card" id="c-needs"><h2>🔴 Needs you<span class="n">'+needs.items.length+'</span></h2>';
  if(needs.items.length)h+='<ol class="need">'+needs.items.map(i=>'<li>'+i+'</li>').join('')+'</ol>';
  if(also.items.length)h+='<details open><summary>Also on your plate ('+also.items.length+')</summary><ul class="need" style="list-style:disc">'+also.items.map(i=>'<li>'+i+'</li>').join('')+'</ul></details>';
  h+='<div class="muted">From your '+esc(B.when||'')+' briefing.</div></div>';
  // Leads
  h+='<div class="card" id="c-leads"><h2>🎯 Leads<span class="n">'+leads.length+' new</span></h2>';
  if(!leads.length)h+='<div class="muted">No new leads in the last 3 weeks.</div>';
  leads.forEach(l=>{h+='<div class="item"><div class="who">'+esc(l.name)+'</div><div class="meta">'+esc(l.source||'')+' · came in '+(l.days===0?'today':l.days===1?'yesterday':l.days+' days ago')+'</div>'+
    (l.tags||[]).map(t=>'<span class="pill">'+esc(t)+'</span>').join('')+'<div class="acts"><a class="btn ghost" target="_blank" href="'+fub(l.id)+'">Open in CRM</a></div></div>'});
  if(D.showings_agents_new)h+='<div class="muted">Plus '+D.showings_agents_new+' showing agents added from feedback (not leads).</div>';
  if(radar.length){h+='<h2 style="margin-top:14px">⭐ Your watchlist</h2>';
    radar.forEach(p=>{const cls=p.status==='needs_reply'?'gold':p.status==='going_cold'||p.status==='overdue'?'red':p.status==='paperwork'?'purple':'';
      h+='<div class="trow" onclick="window.open(\''+fub(p.id)+'\')"><span class="tt"><b>'+esc(p.name)+'</b> <span class="muted">'+esc(p.deal)+'</span></span><span class="pill '+cls+'">'+esc(p.why)+'</span></div>'})}
  const fu=D.followups||{};const stale=(fu.stale||[]).concat(fu.overdue||[]);
  if(stale.length){h+='<details><summary>Going quiet — reach out ('+stale.length+')</summary>'+stale.map(p=>'<div class="trow" onclick="window.open(\''+fub(p.id)+'\')"><span class="tt"><b>'+esc(p.name)+'</b> <span class="muted">'+esc(p.stage||'')+'</span></span><span class="pill red">'+(p.days_since_contact?p.days_since_contact+' days quiet':esc((p.task||p.name_task||'task overdue')))+'</span></div>').join('')+'</details>'}
  h+='</div>';
  // Calendar
  h+='<div class="card" id="c-cal"><h2>📅 Today & tomorrow</h2>';
  let lastDay='';cal.forEach(e=>{const dl=dayLabel(e.start);if(dl!==lastDay){h+='<div class="muted" style="margin:8px 0 2px;font-weight:600">'+dl+'</div>';lastDay=dl}
    h+='<div class="ev"><div class="t">'+fmtTime(e.start,e.allday)+'</div><div>'+esc(e.title)+(e.where?'<div class="muted">'+esc(e.where)+'</div>':'')+'</div></div>'});
  if(!cal.length)h+='<div class="muted">Nothing on the calendar.</div>';h+='</div>';
  // Deals
  if(deals.items.length)h+='<div class="card"><h2>🏡 Active deals</h2>'+deals.items.map(i=>'<div class="item">'+i+'</div>').join('')+'</div>';
  // Topics
  h+='<div class="card" id="c-topics"><h2>🧵 Your topics</h2><div class="areas">';
  ['client','assistant','ace'].forEach(a=>{const A=D.areas[a];const ts=(D.topics||[]).filter(t=>t.area===a&&!t.closed&&!t.feed)
      .sort((x,y)=>(x.turn==='you'?0:x.turn==='ace'?1:2)-(y.turn==='you'?0:y.turn==='ace'?1:2)||(x.hours??1e9)-(y.hours??1e9));
    h+='<div class="area"><h3><span class="dot" style="background:'+A.color+'"></span>'+esc(A.name)+' <span class="muted">('+ts.length+')</span></h3>';
    ts.slice(0,6).forEach(t=>h+=topicRow(t));
    if(ts.length>6)h+='<details><summary>'+(ts.length-6)+' more</summary>'+ts.slice(6).map(topicRow).join('')+'</details>';h+='</div>'});
  h+='</div><div class="muted" style="margin-top:8px">Tap a topic to see where it stands, or open the <a href="#web">topic web</a> to see how they connect.</div></div>';
  if(fyi.items.length||done.items.length)h+='<div class="card"><h2>✅ Done & FYI</h2>'+done.items.concat(fyi.items).map(i=>'<div class="item">'+i+'</div>').join('')+'</div>';
  T.innerHTML=h;
  renderPrivateFollowups();
  T.querySelectorAll('.g').forEach(x=>x.onclick=()=>{const el=document.getElementById('c-'+x.dataset.k);el&&el.scrollIntoView({behavior:'smooth'})});
  T.querySelectorAll('.trow[data-id]').forEach(x=>x.onclick=()=>openNote(x.dataset.id));
}
function g(k,label,n,hot){return'<div class="g'+(hot?' hot':'')+'" data-k="'+k+'"><b>'+n+'</b><span>'+label+'</span></div>'}
function emailItem(e,vip){const acct=e.acct.replace('julianna@','').replace('@gmail.com','');
  return'<div class="item'+(vip?' vip':'')+'"><div class="who">'+esc(e.from_name)+'</div>'+
  '<div class="meta">'+esc(e.subject)+'</div>'+(e.snippet?'<div class="snip">'+esc(e.snippet)+'</div>':'')+
  '<span class="pill '+(vip?'gold':'')+'">'+esc(waited(e.hours))+'</span><span class="pill teal">'+compassify(e.why)+'</span>'+(e.unread?'<span class="pill red">unread</span>':'')+'<span class="pill">'+esc(acct)+'</span>'+
  '<div class="acts"><a class="btn" target="_blank" href="'+e.link+'">Open email</a>'+(e.fub_id?'<a class="btn ghost" target="_blank" href="'+fub(e.fub_id)+'">CRM</a>':'')+'</div></div>'}
function topicRow(t){const b=t.turn==='you'?'<span class="pill gold">your turn</span>':t.turn==='ace'?'<span class="pill purple">Ace is on it</span>':'';
  return'<div class="trow" data-id="'+esc(t.id)+'"><span class="tt">'+esc(t.title)+'</span>'+b+'<span class="ago">'+ago(t.hours)+'</span></div>'}

/* ---------- note ---------- */
function openNote(id){const n=byId[id];if(!n)return;openId=id;const t=(D.topics||[]).find(x=>x.id===id);
  document.getElementById('nt').textContent=n.label;let h='';
  if(t){const A=D.areas[t.area];h+='<span class="pill" style="color:'+A.color+'">'+esc(A.name)+'</span>'+(t.turn==='you'?'<span class="pill gold">Your turn</span>':t.turn==='ace'?'<span class="pill purple">Ace is on it</span>':'')+(t.closed?'<span class="pill">Closed</span>':'')+'<span class="pill">Last activity '+ago(t.hours)+'</span>';
    h+='<div class="acts" style="margin-top:10px"><a class="btn" href="'+t.link+'">Open in Telegram</a></div>';
    if(t.opening)h+='<h3>How it started</h3><div class="msg me">'+esc(t.opening)+'</div>';
    if(t.recent&&t.recent.length){h+='<h3>Latest</h3>';t.recent.slice(0,4).forEach(m=>h+='<div class="msg'+(m.who==='julianna'?' me':'')+'"><div class="w">'+(m.who==='julianna'?'You':m.who==='ace'?'Ace':esc(m.who))+' · '+ago((Date.now()-new Date(m.date))/36e5)+'</div>'+esc(m.text)+'</div>')}
  }else{h+='<span class="pill">'+({place:'Property',person:'Person',theme:'Theme',area:'Area'}[n.kind]||'')+'</span>'}
  const rel=[...(nbrs[id]||[])].map(x=>byId[x]).filter(Boolean);
  const grp={};rel.forEach(r=>{const k=r.kind==='topic'?'Topics':r.kind==='area'?'Area':r.kind==='place'?'Properties':r.kind==='person'?'People':'Themes';(grp[k]=grp[k]||[]).push(r)});
  Object.entries(grp).forEach(([k,list])=>h+='<h3>'+k+' ('+list.length+')</h3><div>'+list.map(r=>'<button class="wl" data-id="'+esc(r.id)+'">'+esc(r.label)+'</button>').join('')+'</div>');
  const nb=document.getElementById('nbody');nb.innerHTML=h;nb.scrollTop=0;nb.querySelectorAll('.wl').forEach(b=>b.onclick=()=>{openNote(b.dataset.id);focus(byId[b.dataset.id])});
  document.getElementById('note').classList.add('on');}
function closeNote(){openId=null;document.getElementById('note').classList.remove('on')}
document.getElementById('nx').onclick=closeNote;
(()=>{let y0=null;const nt=document.getElementById('note');nt.addEventListener('touchstart',e=>{if(e.target.closest('.nh,.grab'))y0=e.touches[0].clientY},{passive:true});nt.addEventListener('touchend',e=>{if(y0!=null&&e.changedTouches[0].clientY-y0>70)closeNote();y0=null})})();

/* ---------- web ---------- */
function color(n){if(n.kind==='area'||n.kind==='topic')return D.areas[n.area].color;return KCOL[n.kind]||'#999'}
function rad(n){if(n.kind==='area')return 13;if(n.kind==='topic')return 5+Math.min(4,(nbrs[n.id]||new Set()).size*0.5);return 3.5+Math.min(6,Math.sqrt((nbrs[n.id]||new Set()).size)*1.2)}
function lit(n){const a=hover||openId;if(query)return n._m;if(!a)return true;return n.id===a||(nbrs[a]&&nbrs[a].has(n.id))}
function paint(n,ctx,scale){const r=rad(n),on=lit(n);ctx.globalAlpha=on?1:0.1;
  if(n.turn==='you'){ctx.beginPath();ctx.arc(n.x,n.y,r+4,0,7);ctx.fillStyle='rgba(232,163,61,.35)';ctx.fill()}
  ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fillStyle=(n.closed||n.feed)?'#555':color(n);ctx.fill();
  if(n.kind!=='topic'&&n.kind!=='area'){ctx.lineWidth=1.2/scale;ctx.strokeStyle='#1e1e1e';ctx.stroke()}
  if(n.id===openId){ctx.lineWidth=2/scale;ctx.strokeStyle='#fff';ctx.stroke()}
  const big=n.kind==='area'||n.kind!=='topic';
  if(on&&(scale>(n.kind==='area'?0.3:big?0.9:1.5)||n.id===hover||n.id===openId||(hover&&nbrs[hover]&&nbrs[hover].has(n.id))||(query&&n._m))){
    const fs=Math.max(11/scale,n.kind==='area'?6:3);ctx.font=(big?'600 ':'')+fs+'px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillStyle=n.kind==='area'?'#fff':'#dcddde';let t=n.label;if(t.length>30)t=t.slice(0,28)+'…';ctx.fillText(t,n.x,n.y+r+2/scale)}
  ctx.globalAlpha=1}
function visible(){const nodes=D.graph.nodes.filter(n=>(n.kind!=='area'&&n.kind!=='topic')||areaOn[n.area]);const ids=new Set(nodes.map(n=>n.id));
  const links=D.graph.edges.filter(l=>ids.has(l.source.id||l.source)&&ids.has(l.target.id||l.target));
  const deg={};links.forEach(l=>{const s=l.source.id||l.source,t=l.target.id||l.target;deg[s]=(deg[s]||0)+1;deg[t]=(deg[t]||0)+1});
  const keep=nodes.filter(n=>n.kind==='topic'||n.kind==='area'||(deg[n.id]||0)>=2);const kid=new Set(keep.map(n=>n.id));
  return{nodes:keep,links:links.filter(l=>kid.has(l.source.id||l.source)&&kid.has(l.target.id||l.target))}}
function focus(n){if(!FG||!n||n.x==null)return;FG.centerAt(n.x,n.y+(innerWidth<700?innerHeight*0.22/FG.zoom():0),500);if(FG.zoom()<1.6)FG.zoom(2,500)}
function drawWeb(){if(FG)return;const el=document.getElementById('graph');const W=document.getElementById('webwrap');
  FG=ForceGraph()(el).backgroundColor('#1e1e1e').nodeId('id').nodeRelSize(1).nodeVal(n=>rad(n)**2)
   .linkColor(l=>{const a=hover||openId,s=l.source.id||l.source,t=l.target.id||l.target;if(!a)return(s.startsWith('a:')?'rgba(255,255,255,.07)':'rgba(255,255,255,.13)');return(s===a||t===a)?'rgba(168,130,255,.8)':'rgba(255,255,255,.03)'})
   .linkWidth(l=>{const a=hover||openId,s=l.source.id||l.source,t=l.target.id||l.target;return a&&(s===a||t===a)?1.5:0.6})
   .nodeCanvasObject(paint).nodePointerAreaPaint((n,c,ctx)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(n.x,n.y,rad(n)+5,0,7);ctx.fill()})
   .onNodeHover(n=>{hover=n?n.id:null;el.style.cursor=n?'pointer':'grab'}).onNodeClick(n=>{openNote(n.id);focus(n)})
   .onBackgroundClick(()=>{hover=null;closeNote()}).onNodeDragEnd(n=>{n.fx=n.x;n.fy=n.y}).cooldownTicks(220).d3VelocityDecay(0.28);
  FG.d3Force('charge').strength(-70);FG.d3Force('link').distance(l=>((l.source.id||l.source).startsWith('a:')?70:45));
  const rs=()=>FG.width(W.clientWidth).height(W.clientHeight);rs();addEventListener('resize',rs);
  FG.graphData(visible());setTimeout(()=>FG.zoomToFit(500,40),1600);document.getElementById('hint').remove();
  document.getElementById('af').outerHTML=['client','assistant','ace'].map(a=>'<span class="chipf on" data-a="'+a+'"><span class="dot" style="background:'+D.areas[a].color+'"></span>'+esc(D.areas[a].name)+'</span>').join('');
  document.querySelectorAll('.chipf').forEach(c=>c.onclick=()=>{const a=c.dataset.a;areaOn[a]=!areaOn[a];c.classList.toggle('on',!!areaOn[a]);FG.graphData(visible());setTimeout(()=>FG.zoomToFit(400,40),900)});
  const q=document.getElementById('q');q.oninput=()=>{query=q.value.trim().toLowerCase();D.graph.nodes.forEach(n=>n._m=!!query&&n.label.toLowerCase().includes(query))};
  q.onkeydown=e=>{if(e.key==='Enter'){const m=FG.graphData().nodes.find(n=>n._m);if(m){openNote(m.id);focus(m);q.blur()}}};
  document.getElementById('legend').innerHTML='<b style="color:#dcddde">Big dots</b> = your 3 areas<br><span class="dot" style="background:#4fc1a6"></span> properties · <span class="dot" style="background:#b0b0b0"></span> people · <span class="dot" style="background:#6a9ff5"></span> themes<br><span style="color:#f0c27a">Glow</span> = your turn · grey = closed or automatic'}
function index(){byId={};nbrs={};D.graph.nodes.forEach(n=>{byId[n.id]=n;nbrs[n.id]=new Set()});D.graph.edges.forEach(l=>{nbrs[l.source]&&nbrs[l.source].add(l.target);nbrs[l.target]&&nbrs[l.target].add(l.source)})}
function route(){const web=location.hash==='#web';document.body.classList.toggle('web',web);document.getElementById('s-web').classList.toggle('on',web);document.getElementById('s-today').classList.toggle('on',!web);
  if(location.hash==='#followups')document.getElementById('c-followups')?.scrollIntoView({block:'start'});
  if(D&&(web||innerWidth>=1100))setTimeout(drawWeb,30)}
addEventListener('hashchange',route);
(()=>{const b=document.getElementById('mb'),m=document.getElementById('menu');b.onclick=e=>{e.stopPropagation();m.style.display=m.style.display==='block'?'none':'block'};document.addEventListener('click',e=>{if(!m.contains(e.target)&&e.target!==b)m.style.display='none'})})();
loadLocked().then(d=>{D=d;index();
  const gen=new Date(d.generated_at);document.getElementById('fresh').textContent='Updated '+gen.toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'});
  render();route()}).catch(e=>{document.getElementById('today').innerHTML='<div class="warn">Couldn’t load your command center. Tell me in Telegram.</div>'});
</script></body></html>
